# /dota2 埋点收集端点 —— 插入 shadowjacob.shop 的 server 块内
#
# 设计要点：
#   1. 零后端：nginx 直接 return 204，不转发给任何应用，不写数据库
#   2. 独立日志：事件写 dota2-events.log，不混进主 access.log
#   3. **日志格式不含 IP**——行为数据与身份数据物理分离。
#      需要独立访客数时用主 access.log（那边本来就有 IP），
#      行为分析用这份不含 IP 的，两边不做关联。
#   4. 不设 cookie、不回 Set-Cookie
#
# 部署：把下面两段分别放进 http 块（log_format）与 shadowjacob server 块（location）

# ---- 放进 http 块（/etc/nginx/nginx.conf 的 http{} 内）----
# log_format dota2px '$time_iso8601|$args|$http_user_agent';

# ---- 放进 shadowjacob.shop 的 server 块内 ----
location = /dota2/px {
    access_log /var/log/nginx/dota2-events.log dota2px;
    add_header Cache-Control "no-store" always;
    return 204;
}
